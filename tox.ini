[tox]
skipsdist = true
envlist = py311, py312, py313, py314, py315

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[testenv]
allowlist_externals = make, uv
commands =
    make devready
    make test
passenv =
    PYTHON_VERSION
setenv =
    PYTHONHASHSEED = 0
